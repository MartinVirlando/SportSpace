name: sport_space
description: Aplikasi Android pencarian lapangan olahraga dan rekan bermain berbasis lokasi.

# Aplikasi skripsi — tidak dipublikasikan ke pub.dev
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Firebase (PRD Bagian 4) ---
  firebase_core: ^3.6.0 # inisialisasi Firebase
  firebase_auth: ^5.3.1 # login/register email + password
  cloud_firestore: ^5.4.4 # seluruh data aplikasi

  # --- Lokasi & peta ---
  geolocator: ^13.0.1 # koordinat GPS + izin lokasi
  flutter_map: ^7.0.2 # peta OpenStreetMap
  latlong2: ^0.9.1 # HANYA untuk tipe LatLng milik flutter_map
  # PERINGATAN: jangan pakai Distance() dari latlong2 untuk menghitung jarak.
  # Haversine wajib ditulis manual di core/utils/haversine.dart (PRD AB-01).

  # --- State management ---
  provider: ^6.1.2 # sudah dikunci — jangan ganti Riverpod/BLoC/GetX

  # --- Utilitas ---
  intl: ^0.19.0 # format tanggal dan rupiah
  cached_network_image: ^3.4.1 # foto lapangan

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Menambah package di luar daftar ini butuh izin dulu (CLAUDE.md).
#
# Catatan soal font: prototipe Figma memakai Inter. Untuk memakainya perlu
# `google_fonts` yang TIDAK ada di PRD Bagian 4 — minta izin dulu, atau
# biarkan memakai Roboto bawaan Android (bedanya tipis dan tidak akan
# ditanyakan penguji).

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/     # aktifkan kalau logo Sport Space sudah dibuat
