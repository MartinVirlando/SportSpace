# Aturan analisis statis. Jalankan dengan: flutter analyze
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Definisi Selesai PRD Bagian 12 poin 3: tidak boleh ada print()
    # yang tersisa di kode produksi. Dijadikan error supaya `flutter
    # analyze` gagal, bukan cuma memberi peringatan yang gampang diabaikan.
    avoid_print: true

    prefer_const_constructors: true
    prefer_const_declarations: true
    always_declare_return_types: true
    require_trailing_commas: true

analyzer:
  errors:
    avoid_print: error
    # Kesalahan tipe dari Firestore paling sering muncul di sini.
    invalid_assignment: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
